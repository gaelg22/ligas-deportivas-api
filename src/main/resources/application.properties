spring.application.name=ligas-deportivas

server.port=${PORT:8080}

# Base de datos: se configura con variables de entorno (ver README)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Usuario admin inicial (solo se crea si defines APP_ADMIN_PASSWORD)
app.admin.username=${APP_ADMIN_USERNAME:gael}
app.admin.password=${APP_ADMIN_PASSWORD:}
